<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Первичная настройка — Python Panel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <h1>🐍 Python Panel</h1>
    <p class="muted">Создайте учётную запись администратора для доступа к панели.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Логин</label>
      <input type="text" name="username" required autofocus>
      <label>Пароль (мин. 8 символов)</label>
      <input type="password" name="password" required minlength="8">
      <button type="submit" class="btn btn-primary">Создать администратора</button>
    </form>
  </div>
</main>
</body>
</html>
